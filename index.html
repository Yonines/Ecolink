<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Wonderness</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;

            font-family: Arial, sans-serif;

            background: linear-gradient(
                135deg,
                #f7f0ff,
                #eaf7ff
            );

            color: #333;
        }

        .container {
            width: 90%;
            max-width: 420px;

            background: rgba(255, 255, 255, 0.85);
            padding: 40px 30px;

            border-radius: 25px;

            text-align: center;

            box-shadow:
                0 10px 35px rgba(0, 0, 0, 0.1);
        }

        .butterfly {
            font-size: 55px;
            margin-bottom: 15px;
        }

        h1 {
            font-size: 38px;
            letter-spacing: 5px;
            margin-bottom: 10px;
        }

        .subtitle {
            font-size: 15px;
            color: #777;
            margin-bottom: 30px;
        }

        .playlist-card {
            background: white;
            padding: 25px 20px;

            border-radius: 20px;

            box-shadow:
                0 5px 20px rgba(0, 0, 0, 0.08);
        }

        .playlist-card h2 {
            font-size: 21px;
            margin-bottom: 10px;
        }

        .playlist-card p {
            font-size: 14px;
            line-height: 1.6;
            color: #777;
            margin-bottom: 22px;
        }

        .playlist {
            display: inline-block;

            padding: 13px 25px;

            border-radius: 30px;

            background: #333;
            color: white;

            text-decoration: none;

            font-size: 14px;
            font-weight: bold;
            letter-spacing: 1px;

            transition: 0.2s;
        }

        .playlist:hover {
            transform: scale(1.05);
        }

        .footer {
            margin-top: 25px;

            font-size: 12px;
            color: #999;
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="butterfly">
            🦋
        </div>

        <h1>ECOLINK</h1>

        <p class="subtitle">
            Connected through music ✦
        </p>

        <div class="playlist-card">

            <h2>The ECOLINK Playlist</h2>

            <p>
                
                One playlist connects us all.
            </p>

            <a
                href="https://open.spotify.com/playlist/44xEYf5Wkib7WemwjNI3i6"
                target="_blank"
                class="playlist">
                ▶ OPEN PLAYLIST
            </a>

        </div>

        <p class="footer">
            One bracelet · One connection · One playlist
        </p>

    </div>

</body>
</html>
